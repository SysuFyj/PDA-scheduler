[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pda-vllm-pd"
version = "0.1.0"
description = "Minimal OpenAI-compatible vLLM prefill/decode disaggregation router"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
engine = [
  "nixl>=0.5.0",
  "vllm",
]

[project.scripts]
vllm-pd-router = "vllm_pd_router.proxy:main"
vllm-pd-cluster = "vllm_pd_router.cluster:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
